name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci --runInBand

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # APP_MODE=dev keeps every adapter on its mock path, so the build needs
      # no live vendor keys. The placeholders below only have to satisfy
      # validateRequiredEnv() in instrumentation.ts.
      - name: Build
        run: npm run build
        env:
          APP_MODE: dev
          MONGODB_URI: mongodb://localhost:27017/ci
          ANTHROPIC_API_KEY: ci-placeholder
          NEXTAUTH_SECRET: ci-placeholder-secret-at-least-32-chars-long
          NEXTAUTH_URL: http://localhost:3000
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
