<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Search</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 300px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #f5f5f5; }
    .header { padding: 16px; background: #18181b; border-bottom: 1px solid #27272a; display: flex; align-items: center; gap: 10px; }
    .logo { font-size: 18px; font-weight: 700; color: #6366f1; }
    .subtitle { font-size: 11px; color: #71717a; }
    .body { padding: 16px; }
    .btn { width: 100%; padding: 12px; background: #6366f1; border: none; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s; }
    .btn:hover { background: #4f46e5; }
    .btn-ghost { background: transparent; border: 1px solid #3f3f46; color: #a1a1aa; margin-top: 8px; }
    .btn-ghost:hover { background: #27272a; }
    .status { font-size: 12px; color: #71717a; text-align: center; margin-top: 12px; }
    .signed-in { color: #22c55e; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="logo">Smart Search</div>
      <div class="subtitle">Intent Operating System</div>
    </div>
  </div>
  <div class="body">
    <button class="btn" id="openCurrentPage">⚡ Open Current Page in Smart Search</button>
    <button class="btn btn-ghost" id="openSmartSearch">Open Smart Search</button>
    <div class="status" id="status">Checking sign-in status…</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
